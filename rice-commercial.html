      <div><h1>一碗好米饭</h1><p>AIGC · 产品广告</p></div>
    </div>
    <figure class="case-player project-player portrait" style="--video-ratio:676/900" data-provider="acfun" data-source="https://www.acfun.cn/player/ac49022877" data-title="一碗好米饭">
      <iframe src="https://www.acfun.cn/player/ac49022877" title="一碗好米饭｜A 站视频播放器" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </figure>
    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>一位年轻女性在厨房用长粒香米煮饭。片段跟着开袋、倒米、烹煮、盛饭的顺序展示产品，再用年长女性从质疑到试吃后的反应收住。厨房始终是同一处空间，视线从人物自然落到包装和米饭上。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e8a792e889b2-01.webp" aria-label="放大查看：年轻女性">
              <img src="assets/projects/rice-commercial/e8a792e889b2-01.webp" alt="年轻女性" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>年轻女性</strong><p>东亚面孔，黑发低扎，浅蓝翻领上衣配白色滚边和同色腰系带。语气温和，倒米时动作熟练。截图未见全身，裤装和便鞋按家居风格补设。四格为正脸、侧脸、无头正面着装、无头背面着装。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e8a792e889b2-02.webp" aria-label="放大查看：年长女性">
              <img src="assets/projects/rice-commercial/e8a792e889b2-02.webp" alt="年长女性" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>年长女性</strong><p>东亚面孔，黑色卷发向后梳，灰色翻领纽扣衫，袖口挽起。约六十岁上下。语气直率，试吃后表情从怀疑转为惊讶。截图未见全身，长裤和便鞋按深灰便装补设。四格为正脸、侧脸、无头正面着装、无头背面着装。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e59cbae699af-01.webp" aria-label="放大查看：家用厨房">
              <img src="assets/projects/rice-commercial/e59cbae699af-01.webp" alt="家用厨房" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>家用厨房</strong><p>场景设定用于「两人站在厨房岛台前，米袋落在台面」段落。年长女性伸手指向米袋，年轻女性垂眼看台面。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e98193e585b7-01.webp" aria-label="放大查看：带盖不锈钢锅">
              <img src="assets/projects/rice-commercial/e98193e585b7-01.webp" alt="带盖不锈钢锅" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>带盖不锈钢锅</strong><p>短圆形拉丝不锈钢锅，黑色把手和盖钮。置于左侧炉灶，作为厨房背景摆件。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e98193e585b7-02.webp" aria-label="放大查看：木托盘调味罐组">
              <img src="assets/projects/rice-commercial/e98193e585b7-02.webp" alt="木托盘调味罐组" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>木托盘调味罐组</strong><p>圆角木托盘上放圆形透明玻璃罐，使用浅木盖。罐内以浅褐谷物、深色调味物和白盐区分。用于岛台右侧连续性。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e98193e585b7-03.webp" aria-label="放大查看：生长粒米">
              <img src="assets/projects/rice-commercial/e98193e585b7-03.webp" alt="生长粒米" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>生长粒米</strong><p>象牙白细长颗粒。用于台面洒落、倒入内胆和产品原料特写。六视图以同一小堆米作为摆拍状态。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e98193e585b7-04.webp" aria-label="放大查看：电饭煲">
              <img src="assets/projects/rice-commercial/e98193e585b7-04.webp" alt="电饭煲" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>电饭煲</strong><p>香槟棕金属外壳和黑色椭圆翻盖，侧有把手。用于合盖与煮熟开盖。模型图采用闭合状态，显示屏留白。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e98193e585b7-05.webp" aria-label="放大查看：电饭煲黑色内胆">
              <img src="assets/projects/rice-commercial/e98193e585b7-05.webp" alt="电饭煲黑色内胆" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>电饭煲黑色内胆</strong><p>独立圆形黑色不粘内锅，银色薄口沿。用于接住原料米，与电饭煲外壳分开建模。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e98193e585b7-06.webp" aria-label="放大查看：白瓷饭碗与熟米饭">
              <img src="assets/projects/rice-commercial/e98193e585b7-06.webp" alt="白瓷饭碗与熟米饭" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>白瓷饭碗与熟米饭</strong><p>暖白瓷碗、细色口沿和短圈足，内部盛一碗熟白米饭。用于近景盛饭和结尾试吃。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e98193e585b7-07.webp" aria-label="放大查看：白色盛饭勺">
              <img src="assets/projects/rice-commercial/e98193e585b7-07.webp" alt="白色盛饭勺" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>白色盛饭勺</strong><p>象牙白一体式宽头勺，长柄，勺头圆润。用于从内胆盛出一口熟米饭。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e98193e585b7-08.webp" aria-label="放大查看：蓝绿提手米袋">
              <img src="assets/projects/rice-commercial/e98193e585b7-08.webp" alt="蓝绿提手米袋" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>蓝绿提手米袋</strong><p>白色印刷膜带提手开孔，青绿色山形图案配金色稻穗，下方透出干米粒。用于摆台、提拿和倒米。包装文字与商标从图中省略。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/rice-commercial/e98193e585b7-09.webp" aria-label="放大查看：试吃小勺">
              <img src="assets/projects/rice-commercial/e98193e585b7-09.webp" alt="试吃小勺" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>试吃小勺</strong><p>小型不锈钢椭圆勺面，纤细深色柄。用于年长女性试吃和最后反应。</p></figcaption>
          </figure>
        </div>
      </section>
    </section>
