    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>孩子以第一人称回望重组家庭的往事。街坊的猜测加深了误解，洗碗、递拖鞋与做家务却一点点拉近距离。画面从暖木旧屋切到明亮的新居，使扫帚和扫拖机器人分别成为两代生活的线索。</p>
    </section>
