    <figure class="case-player project-player portrait" style="--video-ratio:510/900" data-provider="acfun" data-source="https://www.acfun.cn/player/ac49026136" data-title="巧克力雪谷">

    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>一块巨大的巧克力在雪谷中融化，变成绕过村落的滑道。滑雪者从弯道掠过，缆车和积雪木屋提供尺度参照。作品用雪的冷白色衬托融化巧克力的质感，把产品特写扩展成一座微缩景观。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e8a792e889b2-01.webp" aria-label="放大查看：红衣滑雪者">
              <img src="assets/projects/chocolate-ski/e8a792e889b2-01.webp" alt="红衣滑雪者" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>红衣滑雪者</strong><p>成年人，番茄红滑雪服、深色裤和银灰头盔。沿滑道领先或交错滑过。原视频人物很小，五官和雪镜上抬的状态按造型需要补画。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e8a792e889b2-02.webp" aria-label="放大查看：黄衣蓝裤滑雪者">
              <img src="assets/projects/chocolate-ski/e8a792e889b2-02.webp" alt="黄衣蓝裤滑雪者" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>黄衣蓝裤滑雪者</strong><p>成年人，姜黄色外套和蓝色雪裤。位于木屋旁栏杆一带。正侧脸和手套下的姿态为复拍设定。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e8a792e889b2-03.webp" aria-label="放大查看：黄衣黑裤滑雪者">
              <img src="assets/projects/chocolate-ski/e8a792e889b2-03.webp" alt="黄衣黑裤滑雪者" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>黄衣黑裤滑雪者</strong><p>成年人，亮黄滑雪夹克和近黑裤，深色头盔。主要沿巧克力板下方的弯道滑行。参考里看不清的五官按成人补画。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e59cbae699af-01.webp" aria-label="放大查看：雪谷巧克力滑雪村">
              <img src="assets/projects/chocolate-ski/e59cbae699af-01.webp" alt="雪谷巧克力滑雪村" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>雪谷巧克力滑雪村</strong><p>场景设定用于「积雪村落中央立着巨大的巧克力板」段落。开场扫过积雪木屋和树，左侧缆车经过。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e98193e585b7-01.webp" aria-label="放大查看：巧克力巨板">
              <img src="assets/projects/chocolate-ski/e98193e585b7-01.webp" alt="巧克力巨板" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>巧克力巨板</strong><p>四块凸起的方格围绕中央平面，棕色巧克力材质。用于画面视觉中心和结尾产品展示，原包装式文字已去除。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e98193e585b7-02.webp" aria-label="放大查看：滑雪杖">
              <img src="assets/projects/chocolate-ski/e98193e585b7-02.webp" alt="滑雪杖" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>滑雪杖</strong><p>深色细杆、圆形雪托、窄握柄。用于滑行中保持动作连贯。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e98193e585b7-03.webp" aria-label="放大查看：滑雪板">
              <img src="assets/projects/chocolate-ski/e98193e585b7-03.webp" alt="滑雪板" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>滑雪板</strong><p>两块窄白雪板，黑色固定件，板头微翘。配给三种造型的滑雪者。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e98193e585b7-04.webp" aria-label="放大查看：积雪针叶树">
              <img src="assets/projects/chocolate-ski/e98193e585b7-04.webp" alt="积雪针叶树" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>积雪针叶树</strong><p>深绿色层状树枝上覆白雪。用于外缘景深和画面框景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e98193e585b7-05.webp" aria-label="放大查看：缆车支架和索线">
              <img src="assets/projects/chocolate-ski/e98193e585b7-05.webp" alt="缆车支架和索线" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>缆车支架和索线</strong><p>积雪的深色支柱、横头和成对索线，供黄色缆车在场景左侧穿行。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e98193e585b7-06.webp" aria-label="放大查看：融化巧克力滑道">
              <img src="assets/projects/chocolate-ski/e98193e585b7-06.webp" alt="融化巧克力滑道" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>融化巧克力滑道</strong><p>有两条细长滑行凹痕的弧形巧克力地表模块。作为融化过程完成后的造型参考。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e98193e585b7-07.webp" aria-label="放大查看：雪地木围栏">
              <img src="assets/projects/chocolate-ski/e98193e585b7-07.webp" alt="雪地木围栏" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>雪地木围栏</strong><p>木桩与双道横杆，顶部少量积雪。沿近处木屋周围布置。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e98193e585b7-08.webp" aria-label="放大查看：雪地木屋">
              <img src="assets/projects/chocolate-ski/e98193e585b7-08.webp" alt="雪地木屋" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>雪地木屋</strong><p>厚雪坡屋顶、原木窗框和木栏阳台。布置在滑道弯曲内侧及雪谷边缘。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chocolate-ski/e98193e585b7-09.webp" aria-label="放大查看：黄色缆车吊厢">
              <img src="assets/projects/chocolate-ski/e98193e585b7-09.webp" alt="黄色缆车吊厢" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>黄色缆车吊厢</strong><p>玻璃窗与深色边框，黄色下壳和上方悬挂钩。作为微缩交通动景。</p></figcaption>
          </figure>
        </div>
      </section>
