    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>银铬墨镜在白棚内旋转，反光先交代窄椭圆镜片和镜腿的轮廓。接着用模特的正面与侧面佩戴镜头补足产品比例和服装搭配，以深灰镜片上的反光收尾。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/chrome-eyewear/e8a792e889b2-01.webp" aria-label="放大查看：银金发女模特">
              <img src="assets/projects/chrome-eyewear/e8a792e889b2-01.webp" alt="银金发女模特" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>银金发女模特</strong><p>成年女模特，长波浪银金发，眼部妆容克制。黑白短机车夹克加白色平口内搭和黑色裤装，定妆图上方眼镜取下以展示五官，佩戴后由分镜补足。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/chrome-eyewear/e59cbae699af-01.webp" aria-label="放大查看：白色无缝影棚">
              <img src="assets/projects/chrome-eyewear/e59cbae699af-01.webp" alt="白色无缝影棚" width="1086" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>白色无缝影棚</strong><p>场景设定用于「眼镜悬浮显形」段落。眼镜由稍偏前方转向镜腿所在一侧，暗镜片保持洁净。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/chrome-eyewear/e98193e585b7-01.webp" aria-label="放大查看：白色平口内搭">
              <img src="assets/projects/chrome-eyewear/e98193e585b7-01.webp" alt="白色平口内搭" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>白色平口内搭</strong><p>夹克内的白色平口上装，短款、平顺边、轻弹面料，留出与外套的叠穿空间。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chrome-eyewear/e98193e585b7-02.webp" aria-label="放大查看：银铬包覆墨镜">
              <img src="assets/projects/chrome-eyewear/e98193e585b7-02.webp" alt="银铬包覆墨镜" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>银铬包覆墨镜</strong><p>镜框抛光银铬、双片狭长椭圆深灰镜片，外圈偏运动包覆。镜腿从前粗到后细，前段保留流线凹凸，去掉任何文字或品牌。上视要表现镜片弧度，底视保留下缘和镜腿连接。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chrome-eyewear/e98193e585b7-03.webp" aria-label="放大查看：黑白拼接短夹克">
              <img src="assets/projects/chrome-eyewear/e98193e585b7-03.webp" alt="黑白拼接短夹克" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>黑白拼接短夹克</strong><p>夹克以黑色与骨白块面拼接，短身、立领和按扣。前后色块连续，背面缝制为依据正面推定。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/chrome-eyewear/e98193e585b7-04.webp" aria-label="放大查看：黑色高腰裤">
              <img src="assets/projects/chrome-eyewear/e98193e585b7-04.webp" alt="黑色高腰裤" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>黑色高腰裤</strong><p>出镜下装只在中景露出腰部，保留黑色高腰外形，裤腿版型按整体造型补全。</p></figcaption>
          </figure>
        </div>
