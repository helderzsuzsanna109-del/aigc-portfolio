      <div><h1>从城市到海岸</h1><p>AIGC · 产品广告</p></div>
    </div>
    <figure class="case-player project-player" style="--video-ratio:900/506" data-provider="acfun" data-source="https://www.acfun.cn/player/ac49022860" data-title="从城市到海岸">
      <iframe src="https://www.acfun.cn/player/ac49022860" title="从城市到海岸｜A 站视频播放器" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </figure>
    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>一辆石墨色电动 SUV 从城市街区驶向海岸。画廊、书页和棕皮内舱串起材质近景，人物从礼服换成便装，车辆也从繁忙街景进入空旷海岸。片段用行驶、乘坐和停驻三个段落交代汽车的外观与座舱。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e8a792e889b2-01.webp" aria-label="放大查看：男主·浅色便装">
              <img src="assets/projects/electric-suv/e8a792e889b2-01.webp" alt="男主·浅色便装" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>男主·浅色便装</strong><p>城市画廊和车内段用浅米色衣裤，取消领结，衬衫领口微开，鞋色与暖内饰相呼应。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e8a792e889b2-02.webp" aria-label="放大查看：男主·礼服造型">
              <img src="assets/projects/electric-suv/e8a792e889b2-02.webp" alt="男主·礼服造型" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>男主·礼服造型</strong><p>从城市高层室内出场的礼服造型，黑白组合、深领结、合体肩线。脸部用后续同一男主侧面参考补全。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e59cbae699af-01.webp" aria-label="放大查看：中央公园城市天际线">
              <img src="assets/projects/electric-suv/e59cbae699af-01.webp" alt="中央公园城市天际线" width="1080" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>中央公园城市天际线</strong><p>场景设定用于「城市与公园出现」段落。沿长条林地缓进，高楼擦过画侧。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e59cbae699af-02.webp" aria-label="放大查看：古典石柱街边">
              <img src="assets/projects/electric-suv/e59cbae699af-02.webp" alt="古典石柱街边" width="1080" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>古典石柱街边</strong><p>场景设定用于「客厅与车首互切」段落。男子走向落地窗，切车辆分体灯。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e59cbae699af-03.webp" aria-label="放大查看：城市斑马线路口">
              <img src="assets/projects/electric-suv/e59cbae699af-03.webp" alt="城市斑马线路口" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>城市斑马线路口</strong><p>场景设定用于「驶过城市路口」段落。车辆穿过斑马线和窄街，保持同一行进方向。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e59cbae699af-04.webp" aria-label="放大查看：棕色车厢内舱">
              <img src="assets/projects/electric-suv/e59cbae699af-04.webp" alt="棕色车厢内舱" width="1080" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>棕色车厢内舱</strong><p>场景设定用于「长凳与车内皮革呼应」段落。窗光掠过长凳，切入棕色皮革和全景玻璃。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e59cbae699af-05.webp" aria-label="放大查看：浅水反射平台">
              <img src="assets/projects/electric-suv/e59cbae699af-05.webp" alt="浅水反射平台" width="1331" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>浅水反射平台</strong><p>场景设定用于「车身倒影与翻页」段落。反射勾出车侧和尾灯，翻书把动作接回室内。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e59cbae699af-06.webp" aria-label="放大查看：白色画廊与阅览台">
              <img src="assets/projects/electric-suv/e59cbae699af-06.webp" alt="白色画廊与阅览台" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>白色画廊与阅览台</strong><p>场景设定用于「进入画廊」段落。男主走入，切轮圈转动纹理。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e59cbae699af-07.webp" aria-label="放大查看：盘山海岸公路">
              <img src="assets/projects/electric-suv/e59cbae699af-07.webp" alt="盘山海岸公路" width="1080" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>盘山海岸公路</strong><p>场景设定用于「沿海行驶」段落。波浪打礁，双黄线与车尾拉出纵深。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e59cbae699af-08.webp" aria-label="放大查看：礁岸观海平台">
              <img src="assets/projects/electric-suv/e59cbae699af-08.webp" alt="礁岸观海平台" width="1080" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>礁岸观海平台</strong><p>场景设定用于「沿海行驶」段落。波浪打礁，双黄线与车尾拉出纵深。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e59cbae699af-09.webp" aria-label="放大查看：高层公寓客厅">
              <img src="assets/projects/electric-suv/e59cbae699af-09.webp" alt="高层公寓客厅" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>高层公寓客厅</strong><p>场景设定用于「客厅与车首互切」段落。男子走向落地窗，切车辆分体灯。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e98193e585b7-01.webp" aria-label="放大查看：低矮皮面长凳">
              <img src="assets/projects/electric-suv/e98193e585b7-01.webp" alt="低矮皮面长凳" width="1440" height="720" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>低矮皮面长凳</strong><p>画廊内受窗光照射的矮长凳，窄木脚、厚皮面、长向稳定。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e98193e585b7-02.webp" aria-label="放大查看：多辐轮毂与轮胎">
              <img src="assets/projects/electric-suv/e98193e585b7-02.webp" alt="多辐轮毂与轮胎" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>多辐轮毂与轮胎</strong><p>细节镜中的深色多辐轮圈与轮胎，中心盖不带标示。保留辐条亮边与胎纹。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e98193e585b7-03.webp" aria-label="放大查看：棕皮独立座椅">
              <img src="assets/projects/electric-suv/e98193e585b7-03.webp" alt="棕皮独立座椅" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>棕皮独立座椅</strong><p>车内棕皮后座，独立头枕、折扶手与软缝线。白底图省去参考中的头枕标识。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e98193e585b7-04.webp" aria-label="放大查看：浅色翻阅画册">
              <img src="assets/projects/electric-suv/e98193e585b7-04.webp" alt="浅色翻阅画册" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>浅色翻阅画册</strong><p>画廊与车内都出现杂志式画册。米白书页留无字版，建模时可保留封面硬度及页边叠层。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e98193e585b7-05.webp" aria-label="放大查看：石墨色大型电动SUV">
              <img src="assets/projects/electric-suv/e98193e585b7-05.webp" alt="石墨色大型电动SUV" width="1440" height="720" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>石墨色大型电动SUV</strong><p>全片主车。深石墨车漆、分体前灯、细红贯穿尾灯、深轮圈和棕皮座舱。车标、牌照和投影文字均留空；底盘为外观示意。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e98193e585b7-06.webp" aria-label="放大查看：车载折叠小桌">
              <img src="assets/projects/electric-suv/e98193e585b7-06.webp" alt="车载折叠小桌" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>车载折叠小桌</strong><p>后座折叠托盘，木色浅薄面板用于承托书本，保留紧凑合页和底部结构。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e98193e585b7-07.webp" aria-label="放大查看：黑色三角钢琴">
              <img src="assets/projects/electric-suv/e98193e585b7-07.webp" alt="黑色三角钢琴" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>黑色三角钢琴</strong><p>高层公寓左侧的黑亮三角钢琴，大体块与深木地板反射，是室内构图锚点。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/electric-suv/e98193e585b7-08.webp" aria-label="放大查看：黑色礼服领结">
              <img src="assets/projects/electric-suv/e98193e585b7-08.webp" alt="黑色礼服领结" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>黑色礼服领结</strong><p>开场男主伸手整理的领结，黑灰哑亮缎、中央绕结、细调节带。</p></figcaption>
          </figure>
        </div>
      </section>
    </section>
