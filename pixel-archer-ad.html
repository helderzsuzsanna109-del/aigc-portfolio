    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>红发弓手从沙漠矿场出发，穿过木构城镇，最后进入熔岩遗迹。宝石、弓技选择和武器外观的更新标出进阶，最后以金甲造型和散落的宝藏给出奖励反馈。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e8a792e889b2-01.webp" aria-label="放大查看：熔岩巨人">
              <img src="assets/projects/pixel-archer-ad/e8a792e889b2-01.webp" alt="熔岩巨人" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>熔岩巨人</strong><p>熔岩巨人使用多孔玄武岩和橙金裂纹，宽背、沉脚和粗重臂形成体积。原片下半身埋在熔岩中，腿部根据形体补齐。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e8a792e889b2-02.webp" aria-label="放大查看：红发弓手·冰系">
              <img src="assets/projects/pixel-archer-ad/e8a792e889b2-02.webp" alt="红发弓手·冰系" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>红发弓手·冰系</strong><p>冰系形态保留红发与暖色眼睛，以蓝灰肩甲和冷灰短披肩体现升级。没有特效叠字。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e8a792e889b2-03.webp" aria-label="放大查看：红发弓手·基础">
              <img src="assets/projects/pixel-archer-ad/e8a792e889b2-03.webp" alt="红发弓手·基础" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>红发弓手·基础</strong><p>原创红发弓手基础版，暖红围领、藏蓝罩衣、旧棕肩片与短皮靴。脸型与后续三版保持一致。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e8a792e889b2-04.webp" aria-label="放大查看：红发弓手·火系">
              <img src="assets/projects/pixel-archer-ad/e8a792e889b2-04.webp" alt="红发弓手·火系" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>红发弓手·火系</strong><p>火系形态同脸型，增赤铜腕甲和深红单肩布。发色和靴型仍可接基础形态，特效不烘入皮肤或背景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e8a792e889b2-05.webp" aria-label="放大查看：红发弓手·金甲">
              <img src="assets/projects/pixel-archer-ad/e8a792e889b2-05.webp" alt="红发弓手·金甲" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>红发弓手·金甲</strong><p>金甲为片尾终态，暖金铜胸甲与胫甲区别前三种，保留红发和轻便弓手身形。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e8a792e889b2-06.webp" aria-label="放大查看：重甲骑士">
              <img src="assets/projects/pixel-archer-ad/e8a792e889b2-06.webp" alt="重甲骑士" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>重甲骑士</strong><p>骑士重甲正面偏银灰、圆肩，背面深酒红披风，头盔形状为全覆面的原创变体。武器和盾牌另归档。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e59cbae699af-01.webp" aria-label="放大查看：坡地木构城镇">
              <img src="assets/projects/pixel-archer-ad/e59cbae699af-01.webp" alt="坡地木构城镇" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>坡地木构城镇</strong><p>场景设定用于「城镇与骑士交锋」段落。主角和骑士相对，转向台阶；局部暖光标识能力反馈。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e59cbae699af-02.webp" aria-label="放大查看：沙漠木架矿场">
              <img src="assets/projects/pixel-archer-ad/e59cbae699af-02.webp" alt="沙漠木架矿场" width="1067" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>沙漠木架矿场</strong><p>场景设定用于「木架下遇见机械蝎」段落。弓手绕入矿场，机械蝎从开阔沙地抬尾。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e59cbae699af-03.webp" aria-label="放大查看：熔岩遗迹峡谷">
              <img src="assets/projects/pixel-archer-ad/e59cbae699af-03.webp" alt="熔岩遗迹峡谷" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>熔岩遗迹峡谷</strong><p>场景设定用于「火山首领从岩浆中露出」段落。巨人高于石台，主角与其保持前后纵深，岩浆发光。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-01.webp" aria-label="放大查看：冰纹弓">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-01.webp" alt="冰纹弓" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>冰纹弓</strong><p>冰系升级弓以深蓝体、浅青晶片和灰握口延续冷光。效果轨迹由后期加。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-02.webp" aria-label="放大查看：冰蓝宝石">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-02.webp" alt="冰蓝宝石" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>冰蓝宝石</strong><p>蓝色升级晶核，用于第二次面板高亮和最终战利品点色。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-03.webp" aria-label="放大查看：原创弓手状态界面">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-03.webp" alt="原创弓手状态界面" width="810" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>原创弓手状态界面</strong><p>屏幕边缘状态覆层原创新排布。状态针、方向点和格槽留空文字，白色中央用来承接场景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-04.webp" aria-label="放大查看：原创弓技升级面板">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-04.webp" alt="原创弓技升级面板" width="1193" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>原创弓技升级面板</strong><p>原创新升级面板以弓形图标、三枚宝石槽和两个技能区说明信息布局，名称和数字留空。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-05.webp" aria-label="放大查看：古金币">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-05.webp" alt="古金币" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>古金币</strong><p>常规战利品金币采用无字同心圈，厚度和锈蚀都便于复制到掉落堆。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-06.webp" aria-label="放大查看：基础木长弓">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-06.webp" alt="基础木长弓" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>基础木长弓</strong><p>基础木弓保留柔弧、细弦线和深握把，独立静物仅用于服装造型搭配。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-07.webp" aria-label="放大查看：多彩掉落宝藏">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-07.webp" alt="多彩掉落宝藏" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>多彩掉落宝藏</strong><p>片尾大型财宝堆，金币与紫、蓝、赤、绿的晶石建立层次。角色不入图，宝物位置可固定。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-08.webp" aria-label="放大查看：火纹弓">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-08.webp" alt="火纹弓" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>火纹弓</strong><p>火系弓使用深木与暖铜装饰，前缘线条有橙色反光。无发射构件或文字。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-09.webp" aria-label="放大查看：皮制箭袋">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-09.webp" alt="皮制箭袋" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>皮制箭袋</strong><p>随人物的旧皮箭袋。深棕带、浅旧皮壳和空口，不附可操作武器细节。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-10.webp" aria-label="放大查看：红宝石">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-10.webp" alt="红宝石" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>红宝石</strong><p>沙漠关卡掉落的红宝石，狭长主切面和暗红次面清楚。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-11.webp" aria-label="放大查看：青铜机械蝎">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-11.webp" alt="青铜机械蝎" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>青铜机械蝎</strong><p>机械蝎为完整生物模型道具。黑铜体节和成对橙点，足与钳的位置在左右、顶底清楚识别；尾端改为原创罩面。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-12.webp" aria-label="放大查看：骑士宽刃道具剑">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-12.webp" alt="骑士宽刃道具剑" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>骑士宽刃道具剑</strong><p>骑士的大宽刃只供造型和手中姿态参考，钝银外形、宽刃和低调铜护手。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pixel-archer-ad/e98193e585b7-13.webp" aria-label="放大查看：骑士宽盾">
              <img src="assets/projects/pixel-archer-ad/e98193e585b7-13.webp" alt="骑士宽盾" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>骑士宽盾</strong><p>骑士盾宽面略鼓，老木、暗铁边和无字圆脐。背握位置以影视搭配补足。</p></figcaption>
          </figure>
        </div>
      </section>
