      <h2 id="video-process">制作重点</h2>
      <article class="process-item">
        <h3>主角造型</h3>
        <p>用深色夹克、针织衫和浅色长裤建立通勤造型。银色耳机在深色服装的衬托下更容易辨认。</p>
        <div class="process-gallery">
          <figure><img src="assets/process-soundstage-character.webp" alt="佩戴银色耳机的主角全身造型" width="733" height="1100" loading="lazy"><figcaption>主角全身设定</figcaption></figure>
        </div>
      </article>
      <article class="process-item">
        <h3>耳机单品与佩戴镜头</h3>
        <p>耳机单品图交代了头梁和耳罩的外形，成片用车厢里的佩戴近景展示产品轮廓。</p>
        <div class="process-pair">
          <figure><img src="assets/process-headphones.webp" alt="耳机单品与佩戴镜头原始素材" loading="lazy"><figcaption>制作资产</figcaption></figure>
          <figure><img src="assets/soundstage-product.webp" alt="耳机单品与佩戴镜头成片画面" loading="lazy"><figcaption>成片截图</figcaption></figure>
        </div>
      </article>
      <article class="process-item">
        <h3>水下环境与光线</h3>
        <p>水下环境图里的冷蓝色调和水面透光，对应成片中人物进入水下的镜头。</p>
        <div class="process-pair">
          <figure><img src="assets/process-underwater.webp" alt="水下环境与光线原始素材" loading="lazy"><figcaption>制作资产</figcaption></figure>
          <figure><img src="assets/soundstage-immersion.webp" alt="水下环境与光线成片画面" loading="lazy"><figcaption>成片截图</figcaption></figure>
        </div>
      </article>
      <article class="process-item">
        <h3>车厢构图与叙事收尾</h3>
        <p>车厢画面以车窗和两侧乘客框住主角。结尾回到同一环境，呼应开场的通勤场景。</p>
        <div class="process-pair">
