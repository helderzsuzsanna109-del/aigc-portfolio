    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>一位通勤青年戴着耳机在地铁上睡着。窗外的城市被火山取代，随后他跌进深海，与巨鲨擦肩，最后惊醒回到车厢。现实和梦境之间的切换，把听觉上的沉浸感变成可见的空间变化。</p>
    </section>
