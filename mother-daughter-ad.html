    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>女孩在简陋的住处为卧床的母亲煮食。视频通过换床和修缮等选择推进，母女刚获得短暂的安稳，破裂的水管又让房间陷入困境。布景连续呈现旧屋、换床和漏水三种状态，把选择的后果直接呈现出来。</p>
    </section>

            <figcaption><strong>卧床的母亲</strong><p>母亲起初虚弱，获得照护后短暂露出笑意。四格用她的象牙色棉质衣裤，画面无病伤细节。</p></figcaption>
