    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>休假回家的孩子因母亲的关心和一枚找不到的发夹与她起了争执。工作来电催着孩子离开，母亲却把找到的夹子交回，又送上一瓶洗发水。第一人称视角和几段日常回忆让孩子慢慢读懂母亲的关心。</p>
    </section>
