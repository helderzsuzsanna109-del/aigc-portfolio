    </div>
    <figure class="case-player project-player portrait" style="--video-ratio:680/900" data-provider="acfun" data-source="https://www.acfun.cn/player/ac49020679" data-title="Doro 换装游戏">

    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>机械夹爪把粉发玩偶放进暖粉色房间，服装选项依次展开。格纹裙、开衫、袜鞋、贝雷帽和小包逐步改变玩偶的轮廓。全片把房间和人物位置固定下来，让每次换装的前后变化一目了然。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e8a792e889b2-01.webp" aria-label="放大查看：粉发玩偶·基础造型">
              <img src="assets/projects/dress-up/e8a792e889b2-01.webp" alt="粉发玩偶·基础造型" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>粉发玩偶·基础造型</strong><p>初始状态是象牙毛绒圆身的非真人布偶，粉发、深紫玻璃眼、侧边淡紫发饰。与换装版相同的小脸轮廓和肢体比例。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e8a792e889b2-02.webp" aria-label="放大查看：粉发玩偶·完成造型">
              <img src="assets/projects/dress-up/e8a792e889b2-02.webp" alt="粉发玩偶·完成造型" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>粉发玩偶·完成造型</strong><p>完成造型的绒偶穿焦糖开衫、奶白上衣、棕格百褶、浅袜鞋和贝雷帽。包为独立道具，人物下两格让服装轮廓无遮挡。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e59cbae699af-01.webp" aria-label="放大查看：暖粉换装房">
              <img src="assets/projects/dress-up/e59cbae699af-01.webp" alt="暖粉换装房" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>暖粉换装房</strong><p>场景设定用于「夹爪提起玩偶」段落。夹爪由吊杆落下，带玩偶在毯面上方轻晃。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-01.webp" aria-label="放大查看：原创换装按钮板">
              <img src="assets/projects/dress-up/e98193e585b7-01.webp" alt="原创换装按钮板" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>原创换装按钮板</strong><p>用于说明五件换装选项的一列原创新图标，正面有衣物暗轮廓，背景白色，无数字或文字。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-02.webp" aria-label="放大查看：圆形木边桌">
              <img src="assets/projects/dress-up/e98193e585b7-02.webp" alt="圆形木边桌" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>圆形木边桌</strong><p>右后小圆桌，浅木台面、三根斜腿，作为台灯和饮料承托。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-03.webp" aria-label="放大查看：奶油色上衣">
              <img src="assets/projects/dress-up/e98193e585b7-03.webp" alt="奶油色上衣" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>奶油色上衣</strong><p>先切换的奶油色小上衣，领口略方，正面蝴蝶小结，不含人物。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-04.webp" aria-label="放大查看：奶白椭圆毯">
              <img src="assets/projects/dress-up/e98193e585b7-04.webp" alt="奶白椭圆毯" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>奶白椭圆毯</strong><p>玩偶脚下暖奶色地毯，长椭圆与短绒在俯面清晰可见。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-05.webp" aria-label="放大查看：弯颈暖光台灯">
              <img src="assets/projects/dress-up/e98193e585b7-05.webp" alt="弯颈暖光台灯" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>弯颈暖光台灯</strong><p>暖光小灯的短弯颈和窄浅罩，在右侧木桌向内打亮。道具图不在白底上落影。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-06.webp" aria-label="放大查看：桌面橙色饮料">
              <img src="assets/projects/dress-up/e98193e585b7-06.webp" alt="桌面橙色饮料" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>桌面橙色饮料</strong><p>右侧木桌上的橙色饮料杯，透明杯壁与短吸管，移除任何印刷。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-07.webp" aria-label="放大查看：棕格百褶裙">
              <img src="assets/projects/dress-up/e98193e585b7-07.webp" alt="棕格百褶裙" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>棕格百褶裙</strong><p>换装棕格短裙，浅深相间，褶从腰线垂下。侧视轮廓略张，五金留空。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-08.webp" aria-label="放大查看：棕色贝雷帽">
              <img src="assets/projects/dress-up/e98193e585b7-08.webp" alt="棕色贝雷帽" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>棕色贝雷帽</strong><p>最终落在头顶的棕色贝雷帽，挺软之间，顶部短小帽柄作为配准点。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-09.webp" aria-label="放大查看：棕色迷你手提包">
              <img src="assets/projects/dress-up/e98193e585b7-09.webp" alt="棕色迷你手提包" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>棕色迷你手提包</strong><p>布偶最后提的迷你皮包，棕皮加小铜环，手提柄弧圆，所有标识清空。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-10.webp" aria-label="放大查看：浅木层架">
              <img src="assets/projects/dress-up/e98193e585b7-10.webp" alt="浅木层架" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>浅木层架</strong><p>房间左侧三层浅木架，架板和侧杆关系固定，植物与花盆可另摆。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-11.webp" aria-label="放大查看：浅木软座椅">
              <img src="assets/projects/dress-up/e98193e585b7-11.webp" alt="浅木软座椅" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>浅木软座椅</strong><p>右侧浅木小椅，弯扶条与奶白软垫，椅脚位置保持一致。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-12.webp" aria-label="放大查看：淡紫侧发饰">
              <img src="assets/projects/dress-up/e98193e585b7-12.webp" alt="淡紫侧发饰" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>淡紫侧发饰</strong><p>初始和完成均保留的淡紫发饰，由缎面淡紫环和奶白下垂窄带组成。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-13.webp" aria-label="放大查看：焦糖棕开衫">
              <img src="assets/projects/dress-up/e98193e585b7-13.webp" alt="焦糖棕开衫" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>焦糖棕开衫</strong><p>焦糖针织开衫，宽袖、灰棕木扣、领口开敞，与浅色内搭形成温差。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-14.webp" aria-label="放大查看：袜鞋套组">
              <img src="assets/projects/dress-up/e98193e585b7-14.webp" alt="袜鞋套组" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>袜鞋套组</strong><p>奶白袜鞋采用一体绒套示意，袜筒有织纹、鞋头圆钝，成双配对。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-15.webp" aria-label="放大查看：金属三指夹爪">
              <img src="assets/projects/dress-up/e98193e585b7-15.webp" alt="金属三指夹爪" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>金属三指夹爪</strong><p>片头悬挂玩偶的银灰三指夹爪，以简化玩具结构展示开爪姿态，吊线和三条臂位置一致。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/dress-up/e98193e585b7-16.webp" aria-label="放大查看：香草小盆栽">
              <img src="assets/projects/dress-up/e98193e585b7-16.webp" alt="香草小盆栽" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>香草小盆栽</strong><p>浅木层架最上层的盆栽，道具仅建单盆，室内两盆可重复摆。</p></figcaption>
          </figure>
        </div>
