    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>本片围绕桃子汽水的口味与冰爽感展开。产品棚里的水冠、鲜桃、方冰和开罐动作穿插城市天台、滑板与群舞镜头。贯穿人物和包装的桃粉色，让运动场景与产品近景保持统一。</p>
    </section>
