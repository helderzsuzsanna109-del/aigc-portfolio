      <article class="process-item">
        <h3>产品包装与人物造型</h3>
        <p>蜜桃粉是罐身的主色，深红字标和桃子切片让观众从正面就能认出口味，罐壁水珠则带出冰镇汽水的质感。人物延续包装的粉色，一套用缎面夹克配浅色长裤，另一套用深粉卫衣、宽松牛仔裤和滑板呈现街头感。两套穿搭有不同的气质，也能让人物画面与产品形成呼应。</p>
