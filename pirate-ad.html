    </div>
    <figure class="case-player project-player portrait" style="--video-ratio:506/900" data-provider="acfun" data-source="https://www.acfun.cn/player/ac49019885" data-title="瓶中海盗船">

    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>银发访客走进海港商店，店主从货架上取出两艘瓶中船。镜头分别从红帆和青雾船的模型过渡到风浪海面，让它们以全尺寸亮相。店内的手部动作和海面上的远景互相呼应。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e8a792e889b2-01.webp" aria-label="放大查看：灰胡子老板">
              <img src="assets/projects/pirate-ad/e8a792e889b2-01.webp" alt="灰胡子老板" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>灰胡子老板</strong><p>木店掌柜面容沉稳，大胡子末端束起，粗白亚麻衫配棕马甲。站姿宽，展示道具时双肘靠身体。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e8a792e889b2-02.webp" aria-label="放大查看：银发女访客">
              <img src="assets/projects/pirate-ad/e8a792e889b2-02.webp" alt="银发女访客" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>银发女访客</strong><p>银发女访客保留银白长卷发、深头巾、皮质短装及罗盘坠饰。衣装按原视频的卡通 3D 画风做原创调整，所有标识清空。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e59cbae699af-01.webp" aria-label="放大查看：乌云开阔风浪海面">
              <img src="assets/projects/pirate-ad/e59cbae699af-01.webp" alt="乌云开阔风浪海面" width="1316" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>乌云开阔风浪海面</strong><p>场景设定用于「第一艘船越浪」段落。从模型比例转入真实海面，船头抬过浪脊，红帆拉紧。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e59cbae699af-02.webp" aria-label="放大查看：旧木货架店内">
              <img src="assets/projects/pirate-ad/e59cbae699af-02.webp" alt="旧木货架店内" width="1194" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>旧木货架店内</strong><p>场景设定用于「柜台前交谈」段落。访客打量陈列，掌柜在柜后抬手指货架。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e59cbae699af-03.webp" aria-label="放大查看：海港木码头外">
              <img src="assets/projects/pirate-ad/e59cbae699af-03.webp" alt="海港木码头外" width="1120" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>海港木码头外</strong><p>场景设定用于「访客靠近临港店门」段落。访客踏上码头，从宝箱与旗串旁走进店。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-01.webp" aria-label="放大查看：圆腹透明展示瓶">
              <img src="assets/projects/pirate-ad/e98193e585b7-01.webp" alt="圆腹透明展示瓶" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>圆腹透明展示瓶</strong><p>第一款圆腹玻璃展示瓶，透明厚底、短粗瓶颈和木塞。船模另列，瓶中保持清空。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-02.webp" aria-label="放大查看：开口金币箱">
              <img src="assets/projects/pirate-ad/e98193e585b7-02.webp" alt="开口金币箱" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>开口金币箱</strong><p>港口店外金币箱，开盖姿态固定，旧木包铜边与内部的无字金币区分质感。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-03.webp" aria-label="放大查看：木货架柜台">
              <img src="assets/projects/pirate-ad/e98193e585b7-03.webp" alt="木货架柜台" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>木货架柜台</strong><p>掌柜面前长木柜台，圆磨边、立板与短柱脚在六面连续，可与柜后货架组合。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-04.webp" aria-label="放大查看：海港红黑挂旗">
              <img src="assets/projects/pirate-ad/e98193e585b7-04.webp" alt="海港红黑挂旗" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>海港红黑挂旗</strong><p>港口上方红黑布旗作为一组挂饰，旗徽改成简洁抽象花位；保留斜绳和磨边。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-05.webp" aria-label="放大查看：赤帆木船模型">
              <img src="assets/projects/pirate-ad/e98193e585b7-05.webp" alt="赤帆木船模型" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>赤帆木船模型</strong><p>圆瓶展示配套的小比例红帆船模型，亚麻帆、木肋和低托架；独立于瓶。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-06.webp" aria-label="放大查看：赤帆远洋船">
              <img src="assets/projects/pirate-ad/e98193e585b7-06.webp" alt="赤帆远洋船" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>赤帆远洋船</strong><p>红帆大船参考保留红黑与金橙船首灯，采用原创三桅舷形和抽象船首雕刻。无海面背景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-07.webp" aria-label="放大查看：青蓝双耳展示瓶">
              <img src="assets/projects/pirate-ad/e98193e585b7-07.webp" alt="青蓝双耳展示瓶" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>青蓝双耳展示瓶</strong><p>第二款青蓝圆形展示瓶。矮木底托、窄脖双耳和木塞为辨识点，瓶内和文字留空。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-08.webp" aria-label="放大查看：青雾船模型">
              <img src="assets/projects/pirate-ad/e98193e585b7-08.webp" alt="青雾船模型" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>青雾船模型</strong><p>青蓝瓶展示配套船模，青帆、米白肋骨和青灯。保留较小展示底托，与实尺版分开。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-09.webp" aria-label="放大查看：青雾骨脊船">
              <img src="assets/projects/pirate-ad/e98193e585b7-09.webp" alt="青雾骨脊船" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>青雾骨脊船</strong><p>蓝绿幽灵大船使用撕缨青帆、深木船体、外露骨白加强件与青灯。船首替换为原创长角形。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/pirate-ad/e98193e585b7-10.webp" aria-label="放大查看：黄铜航海罗盘">
              <img src="assets/projects/pirate-ad/e98193e585b7-10.webp" alt="黄铜航海罗盘" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>黄铜航海罗盘</strong><p>柜台航海小件，带盖黄铜质感，盘面无文字和刻度，指针可作为装饰。</p></figcaption>
          </figure>
        </div>
      </section>
    </section>
