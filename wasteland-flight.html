    <div class="case-intro">
      <div><h1>废土飞行员</h1><p>AIGC · 游戏影像</p></div>
    </div>
    <figure class="case-player project-player portrait" style="--video-ratio:678/900" data-provider="acfun" data-source="https://www.acfun.cn/player/ac49026112" data-title="废土飞行员">
      <iframe src="https://www.acfun.cn/player/ac49026112" title="废土飞行员｜A 站视频播放器" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </figure>
    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>用飞行员的第一人称视角穿过废弃街区。老旧仪表和座舱框体留在画面前景，外部空间从倾斜的高楼夹道变成断楼屋顶和低矮通廊。镜头靠空间宽窄和视野开合表现驾驶中的速度与压迫感。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e8a792e889b2-01.webp" aria-label="放大查看：废土飞行员">
              <img src="assets/projects/wasteland-flight/e8a792e889b2-01.webp" alt="废土飞行员" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>废土飞行员</strong><p>原片为第一人称，人物只见膝部和裤装。脸部、上衣和背面为按棕沙色飞行工装补设。表演重心是快速转向时的轻微动作。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e59cbae699af-01.webp" aria-label="放大查看：低矮楼板通廊">
              <img src="assets/projects/wasteland-flight/e59cbae699af-01.webp" alt="低矮楼板通廊" width="1084" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>低矮楼板通廊</strong><p>场景设定用于「进暗通廊，重新冲入日光」段落。通过阴暗楼板后画面变亮，最终停在下一段街区的方向。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e59cbae699af-02.webp" aria-label="放大查看：低空穿行街区">
              <img src="assets/projects/wasteland-flight/e59cbae699af-02.webp" alt="低空穿行街区" width="1084" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>低空穿行街区</strong><p>场景设定用于「降低到街区尺度飞行」段落。破墙在近处掠过，尘埃由近及远拉出层次。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e59cbae699af-03.webp" aria-label="放大查看：废土高楼夹道">
              <img src="assets/projects/wasteland-flight/e59cbae699af-03.webp" alt="废土高楼夹道" width="1084" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>废土高楼夹道</strong><p>场景设定用于「座舱朝上夹在残楼之间」段落。高楼两侧滚动，随座舱倾斜加速。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e59cbae699af-04.webp" aria-label="放大查看：废墟屋顶群">
              <img src="assets/projects/wasteland-flight/e59cbae699af-04.webp" alt="废墟屋顶群" width="1084" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>废墟屋顶群</strong><p>错落的断楼与裸露楼板为低空掠过屋顶的镜头提供前后层次。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e59cbae699af-05.webp" aria-label="放大查看：旧式飞行器座舱">
              <img src="assets/projects/wasteland-flight/e59cbae699af-05.webp" alt="旧式飞行器座舱" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>旧式飞行器座舱</strong><p>场景设定用于「座舱朝上夹在残楼之间」段落。高楼两侧滚动，随座舱倾斜加速。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e98193e585b7-01.webp" aria-label="放大查看：废铜框舱罩">
              <img src="assets/projects/wasteland-flight/e98193e585b7-01.webp" alt="废铜框舱罩" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>废铜框舱罩</strong><p>舱罩是全片视角边框，棕色骨架和模糊玻璃材质贯穿低空飞行。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e98193e585b7-02.webp" aria-label="放大查看：旧式仪表板">
              <img src="assets/projects/wasteland-flight/e98193e585b7-02.webp" alt="旧式仪表板" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>旧式仪表板</strong><p>模拟飞行器台面，圆形仪表只保留机械质感，表盘不印数字。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e98193e585b7-03.webp" aria-label="放大查看：旧飞行座椅">
              <img src="assets/projects/wasteland-flight/e98193e585b7-03.webp" alt="旧飞行座椅" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>旧飞行座椅</strong><p>从第一人称膝部和空间推断的窄型座位，用于补足座舱平面结构。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e98193e585b7-04.webp" aria-label="放大查看：残楼墙板与碎石组">
              <img src="assets/projects/wasteland-flight/e98193e585b7-04.webp" alt="残楼墙板与碎石组" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>残楼墙板与碎石组</strong><p>破碎混凝土板和灰尘石块，布置在街区路缘、屋顶和通廊角落。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/wasteland-flight/e98193e585b7-05.webp" aria-label="放大查看：飞行控制手柄">
              <img src="assets/projects/wasteland-flight/e98193e585b7-05.webp" alt="飞行控制手柄" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>飞行控制手柄</strong><p>在座舱台下方用作操作动作提示，只提供外观。</p></figcaption>
          </figure>
        </div>
      </section>
    </section>
