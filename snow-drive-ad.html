    <div class="case-intro">
      <div><h1>为小女孩修房子</h1><p>AIGC · 游戏影像</p></div>
    </div>
    <figure class="case-player project-player portrait" style="--video-ratio:506/900" data-provider="acfun" data-source="https://www.acfun.cn/player/ac49019894" data-title="为小女孩修房子">
      <iframe src="https://www.acfun.cn/player/ac49019894" title="为小女孩修房子｜A 站视频播放器" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </figure>
    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>雪地里独自留下的小女孩回到漏风破屋。画面用修窗、生火和更换床铺串起几个玩法选项，最终将冷暗的破屋转为暖木卧房。前后保留窗与床的位置，观众能直接对照每一步修缮的结果。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e8a792e889b2-01.webp" aria-label="放大查看：小女孩">
              <img src="assets/projects/snow-drive-ad/e8a792e889b2-01.webp" alt="小女孩" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>小女孩</strong><p>棕长发、鼻梁雀斑、灰蓝布扣夹袄、膝部和袖口补丁。雪地和室内为同一女孩，室内可伏在被褥内但保留服装版型。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e59cbae699af-01.webp" aria-label="放大查看：封窗旧卧房">
              <img src="assets/projects/snow-drive-ad/e59cbae699af-01.webp" alt="封窗旧卧房" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>封窗旧卧房</strong><p>场景设定用于「温暖选项和房屋变化」段落。保暖选项被点亮，窗边到墙、木地板和被褥依次从冷变暖。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e59cbae699af-02.webp" aria-label="放大查看：漏风破屋">
              <img src="assets/projects/snow-drive-ad/e59cbae699af-02.webp" alt="漏风破屋" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>漏风破屋</strong><p>场景设定用于「破屋里抱膝」段落。女孩坐在床内侧，窗旁飘进冷光。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e59cbae699af-03.webp" aria-label="放大查看：破屋人物调度">
              <img src="assets/projects/snow-drive-ad/e59cbae699af-03.webp" alt="破屋人物调度" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>破屋人物调度</strong><p>在旧床与窗洞之间安排女孩的位置，用于衔接修缮前的人物近景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e59cbae699af-04.webp" aria-label="放大查看：翻新暖木卧房">
              <img src="assets/projects/snow-drive-ad/e59cbae699af-04.webp" alt="翻新暖木卧房" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>翻新暖木卧房</strong><p>场景设定用于「暖屋留镜」段落。女孩坐在暖被中抬脸，吊灯在上方稳定发光。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e59cbae699af-05.webp" aria-label="放大查看：雪地车辙">
              <img src="assets/projects/snow-drive-ad/e59cbae699af-05.webp" alt="雪地车辙" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>雪地车辙</strong><p>场景设定用于「雪地里起身追车」段落。女孩从雪中起身往前，远处车灯先亮后移远。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-01.webp" aria-label="放大查看：保暖选项按钮">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-01.webp" alt="保暖选项按钮" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>保暖选项按钮</strong><p>保暖选项上原创新火堆和棉被图标并排，配白色外沿。火堆在界面出现。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-02.webp" aria-label="放大查看：修缮工具按钮">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-02.webp" alt="修缮工具按钮" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>修缮工具按钮</strong><p>两枚并排维修选项，分别使用原创锤、锯符号，白底且无游戏背景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-03.webp" aria-label="放大查看：原木矮凳">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-03.webp" alt="原木矮凳" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>原木矮凳</strong><p>床脚原木凳，树轮与深浅裂沟保留。可做同型重复件。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-04.webp" aria-label="放大查看：复古深色轿车">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-04.webp" alt="复古深色轿车" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>复古深色轿车</strong><p>雪地驶离的深色复古汽车，保留圆车顶、短红尾灯和低位银保险杠。车表面和底盘无字。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-05.webp" aria-label="放大查看：旧木床架">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-05.webp" alt="旧木床架" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>旧木床架</strong><p>破屋窄木床，暗旧侧围、灰白薄床单和略塌床垫同组，床表面没有人或杂物。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-06.webp" aria-label="放大查看：暖木床头灯">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-06.webp" alt="暖木床头灯" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>暖木床头灯</strong><p>床侧浅布罩台灯，深木底座，局部暖光由场景带出。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-07.webp" aria-label="放大查看：暖黄吊灯">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-07.webp" alt="暖黄吊灯" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>暖黄吊灯</strong><p>暖屋上方暖黄吊灯，圆铃罩、短上接线，灯光用布景参数调整。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-08.webp" aria-label="放大查看：木柄修理锤">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-08.webp" alt="木柄修理锤" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>木柄修理锤</strong><p>修窗使用木柄维修锤，银色钝头、棕木握把，物件独立；不附按钮。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-09.webp" aria-label="放大查看：木柄手锯">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-09.webp" alt="木柄手锯" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>木柄手锯</strong><p>修窗候选道具，窄银灰锯板、棕色封闭手柄，固定板形无标记。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-10.webp" aria-label="放大查看：木质六格窗">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-10.webp" alt="木质六格窗" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>木质六格窗</strong><p>卧房同款双扇六格木窗，修复后先闭合再供暖。窗图保留玻璃和锁扣，窗洞归场景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-11.webp" aria-label="放大查看：木质立柜">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-11.webp" alt="木质立柜" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>木质立柜</strong><p>左侧木质立柜，窄双门、弧把和低踢脚。木色与新屋墙梁一致。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-12.webp" aria-label="放大查看：浅色绒地毯">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-12.webp" alt="浅色绒地毯" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>浅色绒地毯</strong><p>床前粗绒浅米地毯，边沿细绒与秋冬暖色统一。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-13.webp" aria-label="放大查看：翻新木床">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-13.webp" alt="翻新木床" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>翻新木床</strong><p>暖屋新木床，以干净木架、薄床罩和枕头组成。格被可按场景单独叠上。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-14.webp" aria-label="放大查看：软格被">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-14.webp" alt="软格被" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>软格被</strong><p>奶白和浅驼格被用于保暖升级，粗格绗缝及翻边保留，床架另列。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/snow-drive-ad/e98193e585b7-15.webp" aria-label="放大查看：黄色箭头光标">
              <img src="assets/projects/snow-drive-ad/e98193e585b7-15.webp" alt="黄色箭头光标" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>黄色箭头光标</strong><p>点选锤子和保暖时使用的黄色箭头光标，圆角与奶白中芯保持，避免文字和界面背景。</p></figcaption>
          </figure>
        </div>
      </section>
