      <h2 id="project-intro">作品简介</h2>
      <p>三段重聚各有一件记得住的物品。林荫石阶上，孙辈陪爷爷听旧收音机。雾中长椅旁，年轻女子和奶奶打开竹盒分青团。群山露台上，青年通过一部手机与长者说起牵挂。</p>
    </section>
