    <div class="case-intro">
      <div><h1>末世街区</h1><p>AIGC · 游戏影像</p></div>
    </div>
    <figure class="case-player project-player portrait" style="--video-ratio:506/900" data-provider="acfun" data-source="https://www.acfun.cn/player/ac49020677" data-title="末世街区">
      <iframe src="https://www.acfun.cn/player/ac49020677" title="末世街区｜A 站视频播放器" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </figure>
    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>白发角色进入废城街口，零散的游荡尸逐渐围拢。镜头通过俯视走位、升级拾取和青蓝光效交代玩法，随后引入体型更大的尸王，把画面推到挑战结果。街道中线串起走位和关卡变化。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>人物与角色</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e8a792e889b2-01.webp" aria-label="放大查看：白发突击队员">
              <img src="assets/projects/roguelike-ad/e8a792e889b2-01.webp" alt="白发突击队员" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>白发突击队员</strong><p>白色高马尾、深色护具和黑靴使俯视画面可读。角色以泛用末日护具做原创重制，头像与背面保持配色。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e8a792e889b2-02.webp" aria-label="放大查看：街道游荡尸">
              <img src="assets/projects/roguelike-ad/e8a792e889b2-02.webp" alt="街道游荡尸" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>街道游荡尸</strong><p>普通僵尸按同一套衣着和灰绿色调做群体复用，眼睛淡黄，衣服磨损且不画伤口，镜头远处靠亮眼位置辨认。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e8a792e889b2-03.webp" aria-label="放大查看：重型实验尸王">
              <img src="assets/projects/roguelike-ad/e8a792e889b2-03.webp" alt="重型实验尸王" width="1440" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>重型实验尸王</strong><p>大型敌方用岩灰绿肤、破白外套、荧绿背罐和两边厚护臂区分普通僵尸。保留色彩意思，改用无标细节。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e59cbae699af-01.webp" aria-label="放大查看：尸王对峙长街">
              <img src="assets/projects/roguelike-ad/e59cbae699af-01.webp" alt="尸王对峙长街" width="1038" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>尸王对峙长街</strong><p>场景设定用于「尸王压到路口」段落。巨型轮廓越过中轴，画面边缘亮起警示。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e59cbae699af-02.webp" aria-label="放大查看：废城斑马线路口">
              <img src="assets/projects/roguelike-ad/e59cbae699af-02.webp" alt="废城斑马线路口" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>废城斑马线路口</strong><p>场景设定用于「初始进入废城」段落。队员沿中轴走入，方向盘和道具格随之出现。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e98193e585b7-01.webp" aria-label="放大查看：原创废城控制界面">
              <img src="assets/projects/roguelike-ad/e98193e585b7-01.webp" alt="原创废城控制界面" width="810" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>原创废城控制界面</strong><p>以原创排列示意方向垫、状态条、定位图、快捷格和操作键，白底独立归档。画面文字由后期自行叠加。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e98193e585b7-02.webp" aria-label="放大查看：废城碎石路障">
              <img src="assets/projects/roguelike-ad/e98193e585b7-02.webp" alt="废城碎石路障" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>废城碎石路障</strong><p>路口和尸王长街的破路石堆，离道路会车线半步，颜色延续建筑。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e98193e585b7-03.webp" aria-label="放大查看：废弃浅色小巴">
              <img src="assets/projects/roguelike-ad/e98193e585b7-03.webp" alt="废弃浅色小巴" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>废弃浅色小巴</strong><p>停在路沿的浅色退役小巴，窗带与锈线在各面连续，编号车牌清空。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e98193e585b7-04.webp" aria-label="放大查看：斑驳灰色巡逻车">
              <img src="assets/projects/roguelike-ad/e98193e585b7-04.webp" alt="斑驳灰色巡逻车" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>斑驳灰色巡逻车</strong><p>路口左缘灰车，车顶方灯仅作体块。所有车身文字和徽章省去。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e98193e585b7-05.webp" aria-label="放大查看：棕橙废弃轿车">
              <img src="assets/projects/roguelike-ad/e98193e585b7-05.webp" alt="棕橙废弃轿车" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>棕橙废弃轿车</strong><p>堵在侧路的棕橙色轿车。偏暖车漆与冷灰路面搭对比。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e98193e585b7-06.webp" aria-label="放大查看：琥珀能量道具">
              <img src="assets/projects/roguelike-ad/e98193e585b7-06.webp" alt="琥珀能量道具" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>琥珀能量道具</strong><p>第一处光柱中的虚构琥珀能量升级道具。与青光版区分大小、颜色和外缘。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e98193e585b7-07.webp" aria-label="放大查看：红色急救盒">
              <img src="assets/projects/roguelike-ad/e98193e585b7-07.webp" alt="红色急救盒" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>红色急救盒</strong><p>快捷物品格中的红急救包采用无标壳体，方便作为独立道具重新制图。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e98193e585b7-08.webp" aria-label="放大查看：绿色恢复注剂">
              <img src="assets/projects/roguelike-ad/e98193e585b7-08.webp" alt="绿色恢复注剂" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>绿色恢复注剂</strong><p>物品栏小型绿色恢复道具，外形为密封胶囊，留空字样。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/roguelike-ad/e98193e585b7-09.webp" aria-label="放大查看：青光能量发射器">
              <img src="assets/projects/roguelike-ad/e98193e585b7-09.webp" alt="青光能量发射器" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>青光能量发射器</strong><p>第二次升级的虚构青光能量发射器。深铜与青蓝导光体辨识。图仅供造型与特效位置参考。</p></figcaption>
          </figure>
        </div>
      </section>
    </section>
