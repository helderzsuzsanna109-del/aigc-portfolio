    <figure class="case-player project-player portrait" style="--video-ratio:506/900" data-provider="acfun" data-source="https://www.acfun.cn/player/ac49026127" data-title="花海精萃">

    <section class="project-intro" aria-labelledby="project-intro">
      <h2 id="project-intro">作品简介</h2>
      <p>晨露和蝴蝶引出一只墨绿精萃瓶。产品依次置于金色花海、雪山溪畔和苔藓花园，最后停在泛起涟漪的水面。近景里的露水和花材，与远景里的山谷林冠共同构成这支护肤精萃概念广告的自然意象。</p>
    </section>
    <section class="case-process" aria-labelledby="project-assets">
      <h2 id="project-assets">制作资产</h2>
      <p class="process-preview-hint">点击图片放大查看</p>
      <section class="project-asset-group">
        <h3>场景与布景</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e59cbae699af-01.webp" aria-label="放大查看：山谷林冠">
              <img src="assets/projects/botanical-essence/e59cbae699af-01.webp" alt="山谷林冠" width="1316" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>山谷林冠</strong><p>场景设定用于「越过山谷树冠，拉远收尾」段落。晨光逐渐掠过不同高低的树梢。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e59cbae699af-02.webp" aria-label="放大查看：林下晨露微距">
              <img src="assets/projects/botanical-essence/e59cbae699af-02.webp" alt="林下晨露微距" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>林下晨露微距</strong><p>场景设定用于「一滴露水静贴在宽叶上」段落。叶片微微摇动，露水反射林间光。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e59cbae699af-03.webp" aria-label="放大查看：林中苔藓花园">
              <img src="assets/projects/botanical-essence/e59cbae699af-03.webp" alt="林中苔藓花园" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>林中苔藓花园</strong><p>场景设定用于「精萃瓶置于森林花园」段落。光束掠过花瓣，瓶身留在稳定焦平面。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e59cbae699af-04.webp" aria-label="放大查看：深林苔石水池">
              <img src="assets/projects/botanical-essence/e59cbae699af-04.webp" alt="深林苔石水池" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>深林苔石水池</strong><p>场景设定用于「瓶身置于深林池面，涟漪与细光带环绕」段落。从瓶底向外扩散涟漪，轻光带向上散去。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e59cbae699af-05.webp" aria-label="放大查看：金色花海">
              <img src="assets/projects/botanical-essence/e59cbae699af-05.webp" alt="金色花海" width="960" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>金色花海</strong><p>场景设定用于「绿瓶被花海环绕，蝶群飞过」段落。瓶身从微倾回到视线中心，蝶群远近交替掠过。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e59cbae699af-06.webp" aria-label="放大查看：雪山下花海溪流">
              <img src="assets/projects/botanical-essence/e59cbae699af-06.webp" alt="雪山下花海溪流" width="1080" height="1440" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>雪山下花海溪流</strong><p>场景设定用于「精萃瓶出现于山溪边」段落。溪流闪动，镜头从倾斜近景调整到正面。</p></figcaption>
          </figure>
        </div>
      </section>
      <section class="project-asset-group">
        <h3>道具与产品</h3>
        <div class="project-asset-grid">
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-01.webp" aria-label="放大查看：墨绿护肤精萃瓶">
              <img src="assets/projects/botanical-essence/e98193e585b7-01.webp" alt="墨绿护肤精萃瓶" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>墨绿护肤精萃瓶</strong><p>深橄榄绿玻璃、绿金色柱形瓶盖和窄金属环。用于各环境的中心陈列，瓶身文字与品牌按要求去除。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-02.webp" aria-label="放大查看：奶油白玫瑰">
              <img src="assets/projects/botanical-essence/e98193e585b7-02.webp" alt="奶油白玫瑰" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>奶油白玫瑰</strong><p>奶油白层叠花瓣，配短绿茎和叶。用于金色花海与林中花园前景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-03.webp" aria-label="放大查看：带露水的宽叶">
              <img src="assets/projects/botanical-essence/e98193e585b7-03.webp" alt="带露水的宽叶" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>带露水的宽叶</strong><p>长椭圆翠绿叶片和一枚饱满透明晨露。用于开场微距，摆放时让水滴稳沾在叶面。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-04.webp" aria-label="放大查看：浅绿蝴蝶">
              <img src="assets/projects/botanical-essence/e98193e585b7-04.webp" alt="浅绿蝴蝶" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>浅绿蝴蝶</strong><p>浅鼠尾草绿色半透翼，细叶脉和触角。用于兰花停栖和花海转场，六视图使用同一张开姿态。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-05.webp" aria-label="放大查看：浅金色芒草枝">
              <img src="assets/projects/botanical-essence/e98193e585b7-05.webp" alt="浅金色芒草枝" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>浅金色芒草枝</strong><p>纤细金色草穗，干燥材质。花海里用于逆光轮廓和景深。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-06.webp" aria-label="放大查看：白色伞形小花簇">
              <img src="assets/projects/botanical-essence/e98193e585b7-06.webp" alt="白色伞形小花簇" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>白色伞形小花簇</strong><p>白色密集小花呈伞状分枝，用于花海边缘小体量填景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-07.webp" aria-label="放大查看：白色星形山花">
              <img src="assets/projects/botanical-essence/e98193e585b7-07.webp" alt="白色星形山花" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>白色星形山花</strong><p>白色星形花瓣、淡黄中央花簇。用于山溪两岸前景。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-08.webp" aria-label="放大查看：白色雏菊状花">
              <img src="assets/projects/botanical-essence/e98193e585b7-08.webp" alt="白色雏菊状花" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>白色雏菊状花</strong><p>圆形白瓣、金黄色花盘、细绿茎。用于环绕瓶身的低矮花层。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-09.webp" aria-label="放大查看：苔藓石块">
              <img src="assets/projects/botanical-essence/e98193e585b7-09.webp" alt="苔藓石块" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>苔藓石块</strong><p>浅灰褐石面覆湿润墨绿苔藓。用于树林水池边缘和瓶底前方。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-10.webp" aria-label="放大查看：蜜黄色蝴蝶">
              <img src="assets/projects/botanical-essence/e98193e585b7-10.webp" alt="蜜黄色蝴蝶" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>蜜黄色蝴蝶</strong><p>淡蜜色薄翼、深色翼缘和细长身体。用于花海里绕瓶飞过。</p></figcaption>
          </figure>
          <figure>
            <a class="process-preview" href="assets/projects/botanical-essence/e98193e585b7-11.webp" aria-label="放大查看：象牙白兰花">
              <img src="assets/projects/botanical-essence/e98193e585b7-11.webp" alt="象牙白兰花" width="1440" height="960" loading="lazy" decoding="async">
            </a>
            <figcaption><strong>象牙白兰花</strong><p>大而尖的象牙色花瓣与浅黄花唇。用于晨露段蝴蝶停栖。</p></figcaption>
          </figure>
        </div>
      </section>
